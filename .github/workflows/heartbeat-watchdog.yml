name: Heartbeat watchdog

# Added 2026-07-28 - the "watchdog heartbeat on the scheduler" backlog item,
# made concrete now that the GitHub Actions migration is code-complete.
# Sends exactly one Telegram DM (never a channel post) if the engine's
# heartbeat has gone stale - a way to notice the whole pipeline going
# silent (broken secrets, a repo push that never happened, GitHub Actions
# itself down, every symbol's data fetch failing) before you do.
#
# Day 15 fix: this used to read alert_heartbeat.txt, which the comment
# here claimed was "committed by entry-scan.yml every ~15 min" — it never
# was (it's gitignored, and entry-scan.yml's persist step never added it
# even if it weren't). That meant this workflow's own fresh checkout could
# never see it, heartbeat_watchdog.py always saw "no file", and it silently
# treated an 11+ day total outage as "not launched yet". Fixed by restoring
# the SAME .cache/ directory entry-scan.yml already writes
# .cache/heartbeat_status.json into (via actions/cache, same key prefix) —
# see heartbeat_watchdog.py's module docstring and DAY15_IMPLEMENTATION_
# REPORT.md for the full diagnosis.
#
# Still read-only: this workflow never commits state (nor does it ever
# *save* the cache — only restore — so it can't race entry-scan.yml's own
# cache writes), so it doesn't need the `engine-state` concurrency group
# the other workflows share.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Restore latest scan status from cache
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: market-cache-${{ github.run_id }}
          restore-keys: market-cache-

      - name: Check heartbeat freshness
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python heartbeat_watchdog.py
