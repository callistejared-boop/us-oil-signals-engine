name: Entry scan (15 min)

# Replaces the laptop's "XAUUSD Entry Scan 15min" Windows Task Scheduler job.
# Two-stage entry alerter (alert_signals.py): heads-up on a confirmed setup,
# then fires the actual entry when price taps the level. Deduped/stateful via
# pending.json + trades.json, which this workflow commits back to the repo
# after each run so state survives across ephemeral runner instances.
#
# Day 15: the "Restore last-known-good market data cache" step below also
# now carries .cache/heartbeat_status.json — a small, structured record of
# this run's outcome (per-symbol fetch success/failure, whether every
# symbol failed at once) written by alert_signals.py and round-tripped to
# the NEXT run (of this workflow OR of heartbeat-watchdog.yml, which
# restores the same cache) via the same actions/cache mechanism already
# used for market data. This is what heartbeat-watchdog.yml now reads.
# See DAY15_IMPLEMENTATION_REPORT.md for why this exists: the previous
# design (alert_heartbeat.txt) was gitignored and never committed, so the
# watchdog's own fresh checkout could never see it — an 11+ day silent gap.
#
# Day 15 — second, larger fix: the "Persist engine state" step below used
# to commit only pending.json/trades.json/run_ledger.jsonl. Every history/
# audit store built across Days 4-14 (regime, confluence, confidence,
# decision-audit, macro, execution, all 4 broker stores, all 3 data-health
# stores, the experiment registry, the correlation cache) was written by
# THIS SAME job every run and then silently discarded when the runner
# terminated — none of it was ever in any workflow's `git add` list.
# Confirmed by direct audit of every workflow file: see
# DAY15_GIT_HYGIENE_REPORT.md. That means the entire Days 4-14 research/
# evidence layer has likely never survived a single ephemeral run in
# production, independent of the market-data issue above. Now committed
# alongside the files that always were.
#
# Day 16 debug + fix: the persist step's `git add <17 fixed paths>` was
# failing ATOMICALLY every run (exit 128, "did not match any files")
# because some of those paths (confidence_history.jsonl, the broker_*
# stores, experiment_registry.jsonl, etc.) legitimately don't exist yet —
# they're only created once a trade is confirmed/executed, or a research
# experiment is registered. `git add` with multiple pathspecs stages
# NOTHING at all the moment any single pathspec fails to match, not just
# the missing one, and the old `2>/dev/null || true` was silently hiding
# that fatal error every run. Proven directly via run #58's log (see
# DAY16 debug diagnostics below): run_ledger.jsonl showed as genuinely
# modified in `git status` both before and after `git add`, because the
# add itself never staged anything.
#
# Fix: only pass paths that currently exist on disk to `git add`, so an
# as-yet-unborn optional history file is normal, expected state rather
# than an error that poisons the whole persist step. The ls/check-ignore/
# git-status/diff-stat debug lines are temporary — remove once a live run
# confirms run_ledger.jsonl and friends are actually landing on
# origin/main again.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

concurrency:
  group: engine-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore last-known-good market data cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: market-cache-${{ github.run_id }}
          restore-keys: market-cache-

      - name: Run entry scanner
        # Day 15: continue-on-error was removed here. alert_signals.py
        # already degrades gracefully for partial failures (one symbol's
        # data unavailable never stops the others) — that behavior is
        # unchanged. But a TOTAL outage (every symbol failed to fetch)
        # now makes the script exit non-zero on purpose, specifically so
        # this step — and therefore this job — shows red in the Actions
        # tab instead of a permanently-green run that did nothing. The
        # "Persist engine state" step below still runs regardless
        # (if: always()), so any partial state from a mixed-outcome run
        # is never lost.
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          TELEGRAM_CHANNEL_WTIUSD: ${{ secrets.TELEGRAM_CHANNEL_WTIUSD }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          SYMBOLS: ${{ secrets.SYMBOLS }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          DASHBOARD_PUBLISH_SECRET: ${{ secrets.DASHBOARD_PUBLISH_SECRET }}
        run: python alert_signals.py

      - name: Persist engine state
        if: always()
        run: |
          git config user.name "gold-engine-bot"
          git config user.email "actions@users.noreply.github.com"
          echo "[DEBUG] pwd: $(pwd)"
          echo "[DEBUG] git toplevel: $(git rev-parse --show-toplevel)"
          echo "[DEBUG] ls -l run_ledger.jsonl:"
          ls -l run_ledger.jsonl || echo "[DEBUG] run_ledger.jsonl missing from disk"
          echo "[DEBUG] git check-ignore -v run_ledger.jsonl:"
          git check-ignore -v run_ledger.jsonl || echo "[DEBUG] run_ledger.jsonl not ignored"
          echo "[DEBUG] git status --short (before add):"
          git status --short

          # Day 16 fix: only add paths that actually exist right now.
          # Files like confidence_history.jsonl / broker_*.jsonl /
          # experiment_registry.jsonl are legitimately absent until their
          # first real write (confirmed trade, registered experiment,
          # etc.) — that's expected, not an error, and must not abort
          # staging of everything else.
          STATE_FILES=(
            pending.json trades.json run_ledger.jsonl
            regime_history.jsonl confluence_history.jsonl confidence_history.jsonl
            decision_audit.jsonl macro_history.jsonl execution_history.jsonl
            broker_orders.jsonl broker_fills.jsonl broker_events.jsonl broker_accounts.jsonl
            data_health_history.jsonl data_health_heartbeat_history.jsonl
            data_health_observations.jsonl experiment_registry.jsonl correlation_cache.json
          )
          TO_ADD=()
          for f in "${STATE_FILES[@]}"; do
            if [ -e "$f" ]; then
              TO_ADD+=("$f")
            else
              echo "[DEBUG] skipping $f — not present on disk this run (expected until its first write)"
            fi
          done
          if [ "${#TO_ADD[@]}" -gt 0 ]; then
            git add -- "${TO_ADD[@]}"
            echo "[DEBUG] git add exit code: $?"
          else
            echo "[DEBUG] no state files present to add"
          fi

          echo "[DEBUG] git status --short (after add):"
          git status --short
          echo "[DEBUG] git diff --cached --stat:"
          git diff --cached --stat
          if ! git diff --cached --quiet; then
            git commit -m "state: entry-scan update [skip ci]"
            for i in 1 2 3 4 5; do
              git pull --rebase origin "$(git rev-parse --abbrev-ref HEAD)" && \
              git push origin HEAD && break
              echo "push contended, retry $i..."; sleep $((RANDOM % 8 + 3))
            done
          else
            echo "no state changes this run"
          fi
