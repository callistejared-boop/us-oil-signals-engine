name: WTI hourly analysis

# Replaces the laptop's "WTI Hourly Analysis" Windows Task Scheduler job.
# Full institutional WTI note (multi-timeframe ICT/SMC + regime + guards +
# live geopolitics) -> Telegram, plus publishes the dashboard snapshot to
# Supabase. State (trades.json, macro.json, run_ledger.jsonl) is committed
# back to the repo so it survives across ephemeral runner instances.

on:
  schedule:
    - cron: "6 * * * *"   # a few minutes past the hour to avoid GH's :00 congestion
  workflow_dispatch: {}

concurrency:
  group: engine-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  hourly:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore last-known-good market data cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: market-cache-${{ github.run_id }}
          restore-keys: market-cache-

      - name: Run WTI hourly pipeline
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          TELEGRAM_CHANNEL_WTIUSD: ${{ secrets.TELEGRAM_CHANNEL_WTIUSD }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          SYMBOLS: ${{ secrets.SYMBOLS }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          DASHBOARD_PUBLISH_SECRET: ${{ secrets.DASHBOARD_PUBLISH_SECRET }}
        run: python wti_hourly.py >> wti_hourly.log 2>&1

      - name: Persist engine state
        if: always()
        run: |
          git config user.name "gold-engine-bot"
          git config user.email "actions@users.noreply.github.com"
          git add trades.json macro.json run_ledger.jsonl fundamentals.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "state: wti-hourly update [skip ci]"
            for i in 1 2 3 4 5; do
              git pull --rebase origin "$(git rev-parse --abbrev-ref HEAD)" && \
              git push origin HEAD && break
              echo "push contended, retry $i..."; sleep $((RANDOM % 8 + 3))
            done
          else
            echo "no state changes this run"
          fi

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wti-hourly-log-${{ github.run_id }}
          path: wti_hourly.log
          retention-days: 14
