name: Fundamentals daily backstop

# Replaces the laptop's "WTI Fundamentals Refresh" Windows Task Scheduler
# job (originally 06:00 local time -- cron below is UTC, adjust the hour to
# taste). Deliberately redundant with news-refresh.yml's 5-min call to the
# same script: this is a guaranteed once-a-day refresh in case a transient
# RSS/EIA failure caused the 5-min job to skip it repeatedly.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

concurrency:
  group: engine-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fundamentals:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Refresh fundamentals
        continue-on-error: true
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: python engine/fundamentals_feed.py

      - name: Persist engine state
        if: always()
        run: |
          git config user.name "gold-engine-bot"
          git config user.email "actions@users.noreply.github.com"
          git add fundamentals.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "state: fundamentals-daily update [skip ci]"
            for i in 1 2 3 4 5; do
              git pull --rebase origin "$(git rev-parse --abbrev-ref HEAD)" && \
              git push origin HEAD && break
              echo "push contended, retry $i..."; sleep $((RANDOM % 8 + 3))
            done
          else
            echo "no state changes this run"
          fi
